[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "murder-plan-solver"
version = "0.1.0"
description = "Finite-horizon minimax solver for the Tragedy Analysis Murder Plan game"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
]

[project.scripts]
murder-plan = "murder_plan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

